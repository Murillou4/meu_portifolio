<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9D70C3"/>
      <stop offset="1" stop-color="#D3E97A"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="800" rx="28" fill="url(#bg)"/>

  <!-- header bar -->
  <rect x="60" y="60" width="880" height="64" rx="14" fill="#1A1A1A"/>
  <circle cx="104" cy="92" r="14" fill="url(#accent)"/>
  <rect x="130" y="84" width="140" height="16" rx="8" fill="#333333"/>
  <circle cx="870" cy="92" r="10" fill="#4CAF50" filter="url(#glow)"/>

  <!-- left sidebar (collections) -->
  <rect x="60" y="160" width="230" height="300" rx="16" fill="#1A1A1A"/>
  <rect x="84" y="188" width="100" height="14" rx="7" fill="#3A3A3A"/>
  <g>
    <circle cx="98" cy="240" r="8" fill="#9D70C3"/>
    <rect x="116" y="234" width="140" height="12" rx="6" fill="#2E2E2E"/>
    <circle cx="98" cy="290" r="8" fill="#D3E97A"/>
    <rect x="116" y="284" width="120" height="12" rx="6" fill="#2E2E2E"/>
    <circle cx="98" cy="340" r="8" fill="#9D70C3"/>
    <rect x="116" y="334" width="150" height="12" rx="6" fill="#2E2E2E"/>
    <circle cx="98" cy="390" r="8" fill="#D3E97A"/>
    <rect x="116" y="384" width="130" height="12" rx="6" fill="#2E2E2E"/>
    <rect x="116" y="420" width="100" height="12" rx="6" fill="#2E2E2E"/>
  </g>

  <!-- main request panel -->
  <rect x="320" y="160" width="620" height="300" rx="16" fill="#1A1A1A"/>
  <rect x="348" y="192" width="250" height="44" rx="22" fill="#1F1F1F" stroke="#2E2E2E" stroke-width="2"/>
  <rect x="364" y="204" width="64" height="20" rx="10" fill="#D3E97A"/>
  <rect x="442" y="210" width="120" height="8" rx="4" fill="#3A3A3A"/>
  <rect x="700" y="192" width="60" height="44" rx="12" fill="#9D70C3"/>
  <rect x="716" y="212" width="28" height="4" rx="2" fill="#0A0A0A"/>

  <!-- tabs -->
  <rect x="348" y="262" width="70" height="28" rx="14" fill="#2E2E2E"/>
  <rect x="430" y="262" width="80" height="28" rx="14" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="1.5"/>
  <rect x="522" y="262" width="70" height="28" rx="14" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="1.5"/>
  <rect x="604" y="262" width="70" height="28" rx="14" fill="#1A1A1A" stroke="#2E2E2E" stroke-width="1.5"/>

  <!-- response panel -->
  <rect x="348" y="310" width="564" height="124" rx="12" fill="#121212" stroke="#2E2E2E" stroke-width="1.5"/>
  <rect x="372" y="332" width="64" height="20" rx="10" fill="#4CAF50"/>
  <rect x="450" y="338" width="90" height="8" rx="4" fill="#3A3A3A"/>
  <rect x="372" y="372" width="30" height="10" rx="5" fill="#9D70C3"/>
  <rect x="414" y="372" width="180" height="10" rx="5" fill="#2E2E2E"/>
  <rect x="372" y="394" width="24" height="10" rx="5" fill="#D3E97A"/>
  <rect x="408" y="394" width="150" height="10" rx="5" fill="#2E2E2E"/>
  <rect x="372" y="416" width="20" height="10" rx="5" fill="#9D70C3"/>
  <rect x="404" y="416" width="130" height="10" rx="5" fill="#2E2E2E"/>

  <!-- status bar -->
  <rect x="60" y="500" width="880" height="56" rx="14" fill="#1A1A1A"/>
  <circle cx="96" cy="528" r="7" fill="#4CAF50" filter="url(#glow)"/>
  <rect x="116" y="522" width="160" height="12" rx="6" fill="#333333"/>
  <rect x="700" y="522" width="120" height="12" rx="6" fill="#2E2E2E"/>
</svg>
